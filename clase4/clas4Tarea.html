<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TareaClase</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <section class="contenedor">
        <div class="box">
            <h2>SHOES</h2>
            <p>Zapatillas deportivas de alta calidad y máxima comodidad.</p>
            <p class="precio">$59.99</p>
            <button class="btn-comprar">Comprar</button>
        </div>

        <div class="box">
            <h2>EARPHONE</h2>
            <p>Auriculares inalámbricos con cancelación de ruido activa.</p>
            <p class="precio">$29.99</p>
            <button class="btn-comprar">Comprar</button>
        </div>

        <div class="box">
            <h2>WATCH</h2>
            <p>Reloj inteligente con monitor de ritmo cardíaco y GPS.</p>
            <p class="precio">$99.99</p>
            <button class="btn-comprar">Comprar</button>
        </div>

        <div class="box">
            <h2>MOBILE</h2>
            <p>Teléfono móvil con pantalla HD y cámara de alta resolución.</p>
            <p class="precio">$299.99</p>
            <button class="btn-comprar">Comprar</button>
        </div>
    </section>
</body>
</html>
